name: wheels

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  arq-rs:
    name: arq-rs manylinux (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
      # cp312 only. A second interpreter in the same cargo target dir
      # rebuilds pyo3-ffi with the wrong headers, and 3.15t has no PyConfig.
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist -i python3.12
          manylinux: auto
          rust-toolchain: 1.99.1
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-arq-rs-${{ matrix.target }}
          path: dist/*

  arq-rs-worker:
    name: arq-rs-worker (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64
            runner: ubuntu-24.04
          - target: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Check the worker version pin
        run: scripts/build-worker-wheel.sh --check
      # The runner image already has cargo-fmt. Installing the toolchain
      # from rust-toolchain.toml on top of that reports a component conflict.
      - name: Install Rust 1.99.1
        run: |
          rustup toolchain uninstall 1.99.1 || true
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt,clippy
          rustup default 1.99.1
      # The manylinux image builds CPython with --disable-shared, so it has
      # no libpython to link. This job links the runner's libpython3.12.so.1.0.
      - name: Install CPython 3.12 and maturin
        run: |
          sudo apt-get update
          sudo apt-get install -y python3.12 python3.12-dev python3.12-venv patchelf
          if ! python3.12 -m pip --version >/dev/null 2>&1; then
            curl -sS https://bootstrap.pypa.io/get-pip.py | python3.12
          fi
          python3.12 -m pip install --user --disable-pip-version-check "maturin>=1.16,<2"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build the worker wheel
        env:
          PYO3_PYTHON: /usr/bin/python3.12
          ARQ_AUDITWHEEL: repair
        run: scripts/build-worker-wheel.sh
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-arq-rs-worker-${{ matrix.target }}
          path: dist/*

  release-gate:
    name: annotated release tag
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      # checkout writes a lightweight tag even when the remote tag is annotated,
      # so cat-file would see a commit. Fetch the tag object before the check.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require an annotated tag
        run: |
          git fetch origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}" --force
          kind=$(git cat-file -t "refs/tags/${GITHUB_REF_NAME}")
          if [ "$kind" != "tag" ]; then
            echo "${GITHUB_REF_NAME} is a ${kind}. Publish accepts an annotated v* tag only." >&2
            exit 1
          fi

  publish-arq-rs:
    name: publish arq-rs
    needs: [arq-rs, arq-rs-worker, release-gate]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # PyPI binds one owner/repo/workflow/environment to one project.
    # This job's environment is the pending publisher for arq-rs.
    # workflow_dispatch does not reach this job.
    environment: pypi
    permissions:
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: wheels-*
          merge-multiple: true
      - name: Keep the arq-rs wheels
        run: |
          mkdir -p dist
          find artifacts -type f -name 'arq_rs-*' ! -name 'arq_rs_worker-*' -exec cp {} dist/ \;
          find dist -type f -name '*.whl' | grep -q .
      - name: Publish arq-rs
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true

  publish-arq-rs-worker:
    name: publish arq-rs-worker
    needs: [arq-rs, arq-rs-worker, release-gate, publish-arq-rs]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # A second project needs its own environment. The same wheels.yml
    # and environment name cannot be a pending publisher for both.
    environment: pypi-worker
    permissions:
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: wheels-*
          merge-multiple: true
      - name: Keep the arq-rs-worker wheels
        run: |
          mkdir -p dist
          find artifacts -type f -name 'arq_rs_worker-*' -exec cp {} dist/ \;
          find dist -type f -name '*.whl' | grep -q .
      - name: Publish arq-rs-worker
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true

  smoke:
    name: clean venv smoke
    needs: [arq-rs, arq-rs-worker]
    # ubuntu-latest is 26.04 and has no python3.12 package. The worker
    # wheel is linked against the 24.04 libpython.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: wheels-*-x86_64
          merge-multiple: true
      - name: Install both wheels of one version and import them
        env:
          SMOKE_ARCH: x86_64
        run: |
          sudo apt-get update
          sudo apt-get install -y python3.12 python3.12-venv
          mkdir -p "$RUNNER_TEMP/py312"
          ln -sfn /usr/bin/python3.12 "$RUNNER_TEMP/py312/python3"
          export PATH="$RUNNER_TEMP/py312:$PATH"
          scripts/smoke-venv.sh artifacts
