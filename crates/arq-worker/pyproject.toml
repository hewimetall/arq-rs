[build-system]
requires = ["maturin>=1.16,<2"]
build-backend = "maturin"

[project]
name = "arq-rs-worker"
dynamic = ["version"]
description = "Supervisor binary that runs arq-rs handlers in child processes."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.12"
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Rust",
]
# Kept equal to workspace.package.version. scripts/build-worker-wheel.sh checks this pin.
dependencies = ["arq-rs==0.1.1"]

[project.urls]
Homepage = "https://github.com/hewimetall/arq-rs"
Source = "https://github.com/hewimetall/arq-rs"

[tool.maturin]
bindings = "bin"
manifest-path = "Cargo.toml"
