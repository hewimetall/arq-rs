[build-system]
requires = ["maturin>=1.16,<2"]
build-backend = "maturin"

[project]
name = "arq-rs"
dynamic = ["version"]
description = "Redis queue for Python async handlers, with delivery owned by Rust."
readme = { file = "packaging/arq-rs.md", content-type = "text/markdown" }
requires-python = ">=3.12"
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Rust",
]

[project.urls]
Homepage = "https://github.com/hewimetall/arq-rs"
Source = "https://github.com/hewimetall/arq-rs"

[tool.maturin]
manifest-path = "crates/arq-pybridge/Cargo.toml"
features = ["extension-module"]
python-source = "python"
python-packages = ["arq_rs"]
module-name = "arq_rs._native"
